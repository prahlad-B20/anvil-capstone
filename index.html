<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANVIL — Precision Brew Equipment</title>
<meta name="description" content="ANVIL Brew Co. — a precision coffee equipment catalog. Grinders, kettles, scales and drippers, engineered to spec.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand" data-link>
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v4H4z"/><path d="M6 8v12h12V8"/><path d="M9 12h6"/></svg>
      </span>
      <span class="brand-text">ANVIL<span class="brand-sub">BREW CO.</span></span>
    </a>

    <label class="search" for="search-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="search-input" placeholder="Search equipment…" aria-label="Search products">
    </label>

    <a href="#/cart" class="cart-link" data-link aria-label="View cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </a>
  </div>
</header>

<main id="app" class="app" aria-live="polite">
  <!-- Views are rendered here by the router -->
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>ANVIL BREW CO. — Precision equipment for people who weigh their coffee.</span>
    <span class="footer-mono">BUILT WITH VANILLA JS · NO FRAMEWORK</span>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
